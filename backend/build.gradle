plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.topsiya'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 한글 주석/문자열이 Windows에서 깨지지 않도록
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 프로젝트 경로에 한글(예: D:\작업)이 있으면 Windows 에서 테스트 실행기가 클래스를 못 찾는다.
// 그럴 때만 컴파일된 클래스를 영문 경로(임시 폴더)로 복사해서 거기서 테스트한다.
def projectPathIsAscii = projectDir.absolutePath.chars().allMatch { it < 128 }
if (!projectPathIsAscii) {
    def asciiTestDir = file("${System.getProperty('java.io.tmpdir')}/topsiya-test-classes")
    def copyTestClasses = tasks.register('copyTestClassesToAsciiPath', Sync) {
        from sourceSets.main.output
        from sourceSets.test.output
        into asciiTestDir
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    tasks.named('test', Test) {
        dependsOn copyTestClasses
        testClassesDirs = files(asciiTestDir)
        classpath = files(asciiTestDir) + configurations.testRuntimeClasspath
    }
}
